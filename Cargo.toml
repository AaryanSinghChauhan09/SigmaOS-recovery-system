[package]
name = "sigmaos-recovery-system"
version = "0.1.0"
edition = "2021"
description = "SigmaOS system recovery and rollback system"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-recovery-system"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.0"
sha2 = "0.10"
hex = "0.4"
directories = "5.0"
rand = "0.10.4"
chrono = "0.4.45"

[dev-dependencies]
tempfile = "3.0"
